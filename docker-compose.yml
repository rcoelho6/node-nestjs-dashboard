version: '3.7'
services:
  keycloak-db: # 5439
    image: postgres:9.6-alpine
    container_name: keycloak-db
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak-password
    volumes:
      - pgdata-keycloak-db:/var/lib/postgresql/data
    networks:
      - dashboard_admin_network
    ports:
      - 127.0.0.1:5439:5432
  keycloak:
    image: jboss/keycloak:7.0.1
    container_name: keycloak
    environment:
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=password
      - DB_ADDR=keycloak-db
      - DB_PORT=5432
      - DB_USER=keycloak
      - DB_PASSWORD=keycloak-password
      - DB_VENDOR=postgres
    networks:
      - dashboard_admin_network
    ports:
      - 127.0.0.1:8180:8080      
    depends_on:
      - keycloak-db

volumes:
  pgdata-keycloak-db:
    driver: local

networks:
  dashboard_admin_network:
    name: dashboard_admin_network
